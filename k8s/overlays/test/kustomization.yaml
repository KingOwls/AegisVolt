apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt-test
resources:
  - ../../base
  - namespace.yaml
patches:
  - target:
      kind: ConfigMap
      name: aegisvolt-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: test
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
