apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway, track: canary}
  template:
    metadata:
      labels: {app: gateway, track: canary}
    spec:
      containers:
        - name: gateway
          image: aegisvolt:canary
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: {name: aegisvolt-config}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
spec:
  selector: {app: gateway, track: canary}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisvolt-api-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-canary
                port:
                  number: 8000
