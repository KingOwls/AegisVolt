apiVersion: apps/v1
kind: Deployment
metadata:
  name: station
spec:
  replicas: 1
  selector:
    matchLabels: {app: station, track: stable}
  template:
    metadata:
      labels: {app: station, track: stable}
    spec:
      containers:
        - name: station
          image: aegisvolt:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.station:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: {name: aegisvolt-config}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 512Mi}

