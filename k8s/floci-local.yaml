apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
spec:
  replicas: 1
  selector:
    matchLabels: {app: floci}
  template:
    metadata:
      labels: {app: floci}
    spec:
      containers:
        - name: floci
          image: floci/floci:latest
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            - {name: FLOCI_STORAGE_MODE, value: persistent}
            - {name: FLOCI_DATA_DIR, value: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: floci
spec:
  selector: {app: floci}
  ports:
    - port: 4566
      targetPort: 4566
